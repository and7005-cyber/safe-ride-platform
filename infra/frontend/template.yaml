AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SafeRide frontend - private S3 bucket served by CloudFront via Origin Access
  Control, with SPA error routing, a security response-headers policy and
  Route 53 alias records for the apex and www; plus the us-east-1 alerting:
  uptime probes on the API and the site, CloudFront and certificate alarms and
  the monthly cost budget. Deploy in us-east-1 (CloudFront ACM certs, CloudFront
  and Route 53 health-check metrics live there).

Parameters:
  DomainName:
    Type: String
    Default: saferidelive.co.ke
  HostedZoneId:
    Type: String
    Default: Z0459820URO1AH08IO8T
  CertificateArn:
    Type: String
    Default: ""
    Description: >
      ACM cert ARN in us-east-1 covering the apex + www. Leave empty to deploy
      CloudFront on its default *.cloudfront.net domain (no custom aliases).
  # Security headers (hardening U5). The content-security policy ships
  # report-only in Release 1a and is enforced in Release 2 after the phone
  # checks; switching back is this one parameter. deploy-frontend.sh passes
  # CSP_MODE (default report-only) on every deploy.
  CspMode:
    Type: String
    Default: report-only
    AllowedValues: [report-only, enforce]
    Description: >
      report-only sends Content-Security-Policy-Report-Only (violations show in
      the browser console, nothing is blocked); enforce sends
      Content-Security-Policy.
  ApiOrigin:
    Type: String
    Default: https://api.saferidelive.co.ke
    AllowedPattern: '^https://[a-z0-9.-]+$'
    MaxLength: 100
    ConstraintDescription: must be https://<host> with no port, path or trailing slash.
    Description: >
      Origin of the API the app calls (VITE_API_BASE_URL): allowed by the
      policy's connect-src and probed at /api/health. deploy-frontend.sh passes
      the origin it builds with, so the two cannot drift.
  # Alerting (hardening U5, D12, D19). us-east-1 has its own topic with the
  # same two operator addresses as the backend's; each address gets one email
  # subscription, confirmed from the inbox, and an empty address creates none.
  # deploy-frontend.sh passes ALERT_EMAIL_PRIMARY and ALERT_EMAIL_SECONDARY
  # when exported.
  AlertEmailPrimary:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: must be empty or one email address.
    Description: First operator address subscribed to the us-east-1 alarm topic and the budget (empty = none).
  AlertEmailSecondary:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: must be empty or one email address.
    Description: Second operator address subscribed to the us-east-1 alarm topic and the budget (empty = none).
  MonthlyBudgetUsd:
    Type: Number
    Default: 60
    MinValue: 1
    Description: Monthly cost budget for the whole account, in USD; mail at 80% actual and 100% forecast.

Conditions:
  HasCert: !Not [!Equals [!Ref CertificateArn, ""]]
  CspEnforce: !Equals [!Ref CspMode, enforce]
  HasAlertPrimary: !Not [!Equals [!Ref AlertEmailPrimary, ""]]
  HasAlertSecondary: !Not [!Equals [!Ref AlertEmailSecondary, ""]]
  HasAnyAlert: !Or [!Condition HasAlertPrimary, !Condition HasAlertSecondary]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "saferide-frontend-${AWS::AccountId}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "saferide-oac-${AWS::AccountId}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Hardening U5: every response from the default behaviour (the app shell,
  # hashed assets, sw.js and the SPA error-route index.html) carries these.
  # HSTS covers subdomains (api., mail.) and is not preloaded. The policy text
  # is written twice, once per CspMode branch, because CloudFormation has no
  # template variables and CloudFront takes the enforcing header only from
  # SecurityHeadersConfig; backend/tests/core/test_frontend_stack.py keeps the
  # two copies identical and under CloudFront's 1,783-character limit.
  # Widen it only by what the report-only weeks show (Release 2, U17).
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: SafeRide security headers (HSTS, nosniff, frame denial, referrer, permissions, CSP)
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy: !If
            - CspEnforce
            - ContentSecurityPolicy: !Sub >-
                default-src 'self';
                script-src 'self' https://maps.googleapis.com;
                style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                font-src 'self' https://fonts.gstatic.com data:;
                img-src 'self' data: blob: https://maps.googleapis.com https://maps.gstatic.com https://*.googleusercontent.com;
                connect-src 'self' ${ApiOrigin} https://maps.googleapis.com;
                worker-src 'self' blob:;
                frame-src https://www.google.com;
                manifest-src 'self';
                object-src 'none';
                base-uri 'self';
                form-action 'self';
                frame-ancestors 'none'
              Override: true
            - !Ref AWS::NoValue
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "geolocation=(self), camera=(), microphone=()"
              Override: true
            # An !If list item that evaluates to AWS::NoValue is dropped.
            - !If
              - CspEnforce
              - !Ref AWS::NoValue
              - Header: Content-Security-Policy-Report-Only
                Value: !Sub >-
                  default-src 'self';
                  script-src 'self' https://maps.googleapis.com;
                  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                  font-src 'self' https://fonts.gstatic.com data:;
                  img-src 'self' data: blob: https://maps.googleapis.com https://maps.gstatic.com https://*.googleusercontent.com;
                  connect-src 'self' ${ApiOrigin} https://maps.googleapis.com;
                  worker-src 'self' blob:;
                  frame-src https://www.google.com;
                  manifest-src 'self';
                  object-src 'none';
                  base-uri 'self';
                  form-action 'self';
                  frame-ancestors 'none'
                Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: SafeRide frontend
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Aliases: !If
          - HasCert
          - - !Ref DomainName
            - !Sub "www.${DomainName}"
          - !Ref AWS::NoValue
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Managed CachePolicy: CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CustomErrorResponses:
          # SPA routing: client-side routes resolve to index.html. With OAC on a
          # private bucket a missing key returns 403, so map both 403 and 404.
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        ViewerCertificate: !If
          - HasCert
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ApexRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCert
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # fixed CloudFront alias zone
        EvaluateTargetHealth: false

  ApexRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: HasCert
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCert
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: HasCert
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # ---------------------------------------------------------------- Alerting
  # Hardening U5 (D12, D19). The metrics these alarms read exist only in
  # us-east-1 (Route 53 health checks, CloudFront, the CloudFront certificate),
  # so they report to a topic here; the backend's alarms use saferide-ops in
  # af-south-1. Every alarm sends ALARM and OK. In December nothing calls the
  # API, so only the probes can report a dead stack: they treat missing data as
  # breaching, unlike the count alarms.
  OpsTopicUsEast1:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: saferide-ops-us-east-1

  OpsTopicUsEast1Policy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref OpsTopicUsEast1
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The default owner statement, restated because this policy
          # replaces the topic's default one.
          - Sid: AccountOwnerManage
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:Publish
            Resource: !Ref OpsTopicUsEast1
          - Sid: CloudWatchAlarmsPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OpsTopicUsEast1
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  OpsUsEast1SubscriptionPrimary:
    Type: AWS::SNS::Subscription
    Condition: HasAlertPrimary
    Properties:
      TopicArn: !Ref OpsTopicUsEast1
      Protocol: email
      Endpoint: !Ref AlertEmailPrimary

  OpsUsEast1SubscriptionSecondary:
    Type: AWS::SNS::Subscription
    Condition: HasAlertSecondary
    Properties:
      TopicArn: !Ref OpsTopicUsEast1
      Protocol: email
      Endpoint: !Ref AlertEmailSecondary

  # Three checker regions every 30 seconds keep the probe load near one request
  # every ten seconds per endpoint. Route 53 counts any 2xx or 3xx as healthy.
  ApiHealthCheck:
    Type: AWS::Route53::HealthCheck
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        FullyQualifiedDomainName: !Select [2, !Split ["/", !Ref ApiOrigin]]
        ResourcePath: /api/health
        Port: 443
        EnableSNI: true
        RequestInterval: 30
        FailureThreshold: 3
        Regions:
          - us-east-1
          - eu-west-1
          - ap-southeast-1
      HealthCheckTags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-api-health"

  SiteHealthCheck:
    Type: AWS::Route53::HealthCheck
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        # Without the custom domain the site is only on the distribution's
        # *.cloudfront.net name.
        FullyQualifiedDomainName: !If [HasCert, !Ref DomainName, !GetAtt Distribution.DomainName]
        ResourcePath: /
        Port: 443
        EnableSNI: true
        RequestInterval: 30
        FailureThreshold: 3
        Regions:
          - us-east-1
          - eu-west-1
          - ap-southeast-1
      HealthCheckTags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-site"

  ApiProbeFailing:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        Route 53 probes in three regions have not had a healthy answer from
        the API's /api/health for three minutes, so the API or its database
        is down for everyone; first, curl the health endpoint, then read the
        af-south-1 alarms and /saferide/api and roll back if a deploy just
        landed.
      Namespace: AWS/Route53
      MetricName: HealthCheckStatus
      Dimensions:
        - Name: HealthCheckId
          Value: !Ref ApiHealthCheck
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OpsTopicUsEast1
      OKActions:
        - !Ref OpsTopicUsEast1

  SiteProbeFailing:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        Route 53 probes in three regions have not loaded the site's home page
        for three minutes, so parents, drivers and the office cannot open the
        app; first, open the site and check the CloudFront distribution and
        its S3 bucket, then redeploy the frontend from the last release tag
        if a deploy just landed.
      Namespace: AWS/Route53
      MetricName: HealthCheckStatus
      Dimensions:
        - Name: HealthCheckId
          Value: !Ref SiteHealthCheck
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref OpsTopicUsEast1
      OKActions:
        - !Ref OpsTopicUsEast1

  SiteServerErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        More than 5% of CloudFront responses were 5xx for ten minutes (the S3
        origin or CloudFront itself is failing); first, read the
        distribution's error graphs in the CloudFront console and the AWS
        Health Dashboard for CloudFront and S3.
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref Distribution
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsTopicUsEast1
      OKActions:
        - !Ref OpsTopicUsEast1

  # ACM publishes DaysToExpiry once a day in the certificate's region (this
  # one); a healthy managed certificate renews about 60 days ahead.
  SiteCertificateExpiry:
    Type: AWS::CloudWatch::Alarm
    Condition: HasCert
    Properties:
      AlarmDescription: >-
        The CloudFront certificate for the apex and www expires in under 20
        days, so ACM's managed renewal has not happened; first, check that
        the apex and www validation CNAMEs are still in Route 53 and read the
        certificate's renewal status in ACM in us-east-1.
      Namespace: AWS/CertificateManager
      MetricName: DaysToExpiry
      Dimensions:
        - Name: CertificateArn
          Value: !Ref CertificateArn
      Statistic: Minimum
      Period: 86400
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 20
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsTopicUsEast1
      OKActions:
        - !Ref OpsTopicUsEast1

  # The budget covers the whole account (every service, both regions). Budgets
  # mails its subscribers directly; it needs at least one, hence HasAnyAlert.
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAnyAlert
    Properties:
      Budget:
        BudgetName: saferide-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - !If
              - HasAlertPrimary
              - SubscriptionType: EMAIL
                Address: !Ref AlertEmailPrimary
              - !Ref AWS::NoValue
            - !If
              - HasAlertSecondary
              - SubscriptionType: EMAIL
                Address: !Ref AlertEmailSecondary
              - !Ref AWS::NoValue
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - !If
              - HasAlertPrimary
              - SubscriptionType: EMAIL
                Address: !Ref AlertEmailPrimary
              - !Ref AWS::NoValue
            - !If
              - HasAlertSecondary
              - SubscriptionType: EMAIL
                Address: !Ref AlertEmailSecondary
              - !Ref AWS::NoValue

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Value: !If [HasCert, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
  ResponseHeadersPolicyId:
    Description: CloudFront response-headers policy on the default behaviour (security headers, CSP per CspMode).
    Value: !Ref SecurityHeadersPolicy
  OpsTopicUsEast1Arn:
    Description: SNS topic for the probe, CloudFront and certificate alarms and their OK transitions.
    Value: !Ref OpsTopicUsEast1
  ApiHealthCheckId:
    Description: Route 53 health check on the API's /api/health.
    Value: !Ref ApiHealthCheck
  SiteHealthCheckId:
    Description: Route 53 health check on the site's home page.
    Value: !Ref SiteHealthCheck
