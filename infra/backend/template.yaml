AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SafeRide backend - FastAPI on Lambda (Mangum) behind an HTTP API Gateway,
  with RDS PostgreSQL in an isolated VPC. The app's existing in-app bearer
  auth is preserved as-is; API Gateway is a transparent proxy.

Parameters:
  DbMasterUsername:
    Type: String
    Default: saferide
    Description: RDS master username.
  DbMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: RDS master password (URL-safe; injected at deploy time).
  PinPepper:
    Type: String
    NoEcho: true
    Description: HMAC pepper for driver PIN hashing.
  GoogleMapsApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Server-side Google Maps Platform key (Geocoding, Places, Routes v2).
      Injected at deploy time from SSM /saferide/google-maps-api-key. Empty
      disables Google-backed geo features (autocomplete, road routing).
  FirebaseVapidKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      FCM web-push certificate public key (console-generated). From SSM
      /saferide/firebase-vapid-key. Empty makes web clients use the plain
      Web Push (VAPID) path below instead of native FCM tokens.
  VapidPublicKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Plain Web Push VAPID public key. From SSM /saferide/vapid-public-key.
      Standard Web Push delivery to installed PWAs (Android + iOS 16.4+).
  VapidPrivateKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Plain Web Push VAPID private key. From SSM /saferide/vapid-private-key.
      Signs web-push sends; empty disables the plain Web Push path.
  VapidSubject:
    Type: String
    Default: "mailto:and7005@gmail.com"
    Description: VAPID subject (mailto:/https:) sent with web-push requests.
  CorsOrigins:
    Type: String
    Default: https://saferidelive.co.ke,https://www.saferidelive.co.ke
    Description: Comma-separated allowed CORS origins for the API.
  AppBaseUrl:
    Type: String
    Default: https://saferidelive.co.ke
    Description: Public base URL of the frontend (used in password-reset links).
  ApiDomainName:
    Type: String
    Default: api.saferidelive.co.ke
    Description: Custom domain for the API.
  ApiCertificateArn:
    Type: String
    Default: ""
    Description: >
      ACM certificate ARN (in THIS region) for ApiDomainName. Leave empty to
      deploy without the custom domain; set it once the cert is issued.
  HostedZoneId:
    Type: String
    Default: Z0459820URO1AH08IO8T
    Description: Route 53 hosted zone ID for saferidelive.co.ke.
  DbAppPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Password for the saferide_app runtime role (tenancy). From SSM
      /saferide/db-app-password. Empty skips the migrate Lambda's role sync
      (pre-tenancy stacks); the API switches to this role at Release 5.
  TotpPepper:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      HMAC pepper for provider second-factor secrets (tenancy). From SSM
      /saferide/totp-pepper, which must pre-exist — the deploy script fails
      rather than minting one, because a silent rotation would re-enrol every
      provider.
  # GPS tracking system defaults (GPS plan U11: R26, R31, R38). Each Default
  # equals the Settings default in backend/app/core/config.py (kept in step by
  # backend/tests/core/test_gps_settings.py) and is the value beneath a
  # school's own setting; deploy-backend.sh passes an override only when the
  # operator exports the matching GPS_* variable. Staleness and the fix-wait
  # budget have no per-school column — these ARE their live values.
  GpsCustodyThresholdM:
    Type: Number
    Default: 150
    MinValue: 25
    MaxValue: 2000
    Description: Metres from the stop (less accuracy) beyond which a Board/Drop-off is flagged.
  GpsVicinityRadiusM:
    Type: Number
    Default: 100
    MinValue: 25
    MaxValue: 2000
    Description: Metres (less accuracy) within which a fix counts as "at the stop".
  GpsFixAccuracyCapM:
    Type: Number
    Default: 200
    MinValue: 25
    MaxValue: 2000
    Description: Fixes with reported accuracy above this are too coarse to check against.
  GpsPositionRetentionDays:
    Type: Number
    Default: 90
    MinValue: 7
    MaxValue: 365
    Description: Days the position trail is kept (by receipt time) when a school sets none.
  GpsPingIntervalS:
    Type: Number
    Default: 10
    MinValue: 5
    MaxValue: 60
    Description: Seconds between Phase 2 position pings, served to the driver app.
  GpsStaleAfterS:
    Type: Number
    Default: 90
    MinValue: 10
    MaxValue: 3600
    Description: Seconds after which a served bus position renders stale (system-wide).
  GpsFixWaitBudgetS:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 30
    Description: Seconds a driver tap waits for a cold GPS fix before posting without one (system-wide).
  # API-stage throttling (GPS plan U14, live-parity rule). The account's Lambda
  # concurrency floor is 10, so one looping phone could take every school's
  # console down: the pings route gets its own bound, well under the pool, and
  # the stage a generous default that still stops a runaway client. Numbers are
  # requests per second (rate) and the token bucket (burst); the Defaults are
  # the live values, overridable per deploy from deploy-backend.sh. Kept in
  # step by backend/tests/core/test_gps_settings.py.
  ApiDefaultBurstLimit:
    Type: Number
    Default: 100
    MinValue: 1
    Description: Stage-wide burst limit (requests) for every route without its own setting.
  ApiDefaultRateLimit:
    Type: Number
    Default: 50
    MinValue: 1
    Description: Stage-wide steady-state rate limit (requests per second) for every route without its own setting.
  PingsRouteBurstLimit:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Burst limit (requests) for POST /api/runs/driver/pings.
  PingsRouteRateLimit:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Steady-state rate limit (requests per second) for POST /api/runs/driver/pings.
  DbEngineVersion:
    Type: String
    Default: "16.14"
    Description: PostgreSQL major.minor version for RDS (auto minor upgrades on).
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20

Conditions:
  HasApiCert: !Not [!Equals [!Ref ApiCertificateArn, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512

Resources:
  # ---------------------------------------------------------------- Networking
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: saferide-backend

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: saferide-private-a

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: saferide-private-b

  # Private subnets with NAT egress: the Lambdas must reach Google's Geocoding,
  # Places, and Routes APIs (address autocomplete + road routing) and, when
  # configured, FCM/Web Push endpoints. A single NAT gateway (~$0.06/h in
  # af-south-1) in a public subnet provides that egress; RDS stays private.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: saferide-backend

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.3.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: saferide-public-a

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: saferide-public

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: saferide-backend

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: saferide-private

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  SubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref PrivateRouteTable

  SubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SafeRide Lambda functions
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: saferide-lambda-sg

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SafeRide RDS PostgreSQL
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Postgres from Lambda
      Tags:
        - Key: Name
          Value: saferide-db-sg

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: SafeRide RDS subnets
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB

  # ---------------------------------------------------------------- Database
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: saferide
      MasterUsername: !Ref DbMasterUsername
      MasterUserPassword: !Ref DbMasterPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: saferide

  # ---------------------------------------------------------------- HTTP API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # CORS is handled by the FastAPI app (CORSMiddleware), so it is left off
      # here to avoid duplicate/ conflicting headers.
      Description: SafeRide API
      # Stage throttling (GPS plan U14): the default applies to every route
      # the proxy serves; the pings route is declared as its own route on
      # ApiFunction below so this per-route setting has a key to bind to.
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ApiDefaultBurstLimit
        ThrottlingRateLimit: !Ref ApiDefaultRateLimit
      RouteSettings:
        "POST /api/runs/driver/pings":
          ThrottlingBurstLimit: !Ref PingsRouteBurstLimit
          ThrottlingRateLimit: !Ref PingsRouteRateLimit

  # ---------------------------------------------------------------- Functions
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend
      Handler: app.lambda_handler.handler
      # No ReservedConcurrentExecutions: af-south-1 starts with an account
      # concurrency limit of 10, so reserving any would drop unreserved below
      # the minimum. The function shares the unreserved pool. Request a Lambda
      # concurrency quota increase before scaling up.
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetA
          - !Ref SubnetB
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL: !Sub "postgresql://saferide_app:${DbAppPassword}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/saferide"
          # Release 5: the API runs under the LOGIN NOBYPASSRLS runtime
          # role so migration 015's policies bind every query, and the
          # school header becomes mandatory on the staff surface.
          SCOPE_HEADER_REQUIRED: "true"
          CORS_ORIGINS: !Ref CorsOrigins
          PIN_PEPPER: !Ref PinPepper
          APP_BASE_URL: !Ref AppBaseUrl
          GOOGLE_MAPS_API_KEY: !Ref GoogleMapsApiKey
          # Tenancy (U2): unused until Release 4's provider login ships.
          TOTP_PEPPER: !Ref TotpPepper
          # The two Firebase JSON blobs are too large / special-char-laden for a
          # CFN parameter (SA JSON is ~2.3 KB with a private key); the app pulls
          # them from these SSM SecureString params at startup. VAPID keys are
          # small and shell-safe, so they pass as parameters directly.
          FIREBASE_SERVICE_ACCOUNT_SSM: /saferide/firebase-service-account-json
          FIREBASE_WEB_CONFIG_SSM: /saferide/firebase-web-config-json
          FIREBASE_VAPID_KEY: !Ref FirebaseVapidKey
          VAPID_PUBLIC_KEY: !Ref VapidPublicKey
          VAPID_PRIVATE_KEY: !Ref VapidPrivateKey
          VAPID_SUBJECT: !Ref VapidSubject
          # GPS tracking system defaults (GPS plan U11); the names the app's
          # Settings read. A school's own values override the first five.
          GPS_CUSTODY_THRESHOLD_M: !Ref GpsCustodyThresholdM
          GPS_VICINITY_RADIUS_M: !Ref GpsVicinityRadiusM
          GPS_FIX_ACCURACY_CAP_M: !Ref GpsFixAccuracyCapM
          GPS_POSITION_RETENTION_DAYS: !Ref GpsPositionRetentionDays
          GPS_PING_INTERVAL_S: !Ref GpsPingIntervalS
          GPS_STALE_AFTER_S: !Ref GpsStaleAfterS
          GPS_FIX_WAIT_BUDGET_S: !Ref GpsFixWaitBudgetS
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/saferide/firebase-service-account-json"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/saferide/firebase-web-config-json"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        # The one route with its own throttle (GPS plan U14). Same function,
        # same handler; API Gateway prefers the exact route over the proxy,
        # so nothing else about routing changes.
        Pings:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/runs/driver/pings
            Method: POST

  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend
      Handler: app.migrate_handler.handler
      Timeout: 120
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetA
          - !Ref SubnetB
      Environment:
        Variables:
          DATABASE_URL: !Sub "postgresql://${DbMasterUsername}:${DbMasterPassword}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/saferide"
          # Tenancy (U2): runtime-role sync and provider bootstrap inputs.
          DB_APP_PASSWORD: !Ref DbAppPassword
          PROVIDER_BOOTSTRAP_SSM: /saferide/provider-bootstrap
          # The on-demand gps-purge action resolves the retention default
          # exactly as the API's purge does (GPS plan U11).
          GPS_POSITION_RETENTION_DAYS: !Ref GpsPositionRetentionDays
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/saferide/provider-bootstrap"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  # Read-only go/no-go verification queries against the private-subnet RDS —
  # the only SQL door besides the migrate Lambda. Fixed check-set allowlist,
  # server-enforced read-only session, manual IAM-gated invoke only (no API
  # route). See backend/app/verify_handler.py and infra/scripts/verify-db.sh.
  VerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend
      Handler: app.verify_handler.handler
      Timeout: 60
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetA
          - !Ref SubnetB
      Environment:
        Variables:
          DATABASE_URL: !Sub "postgresql://${DbMasterUsername}:${DbMasterPassword}@${Database.Endpoint.Address}:${Database.Endpoint.Port}/saferide"
          # The `gps` check set reports trail rows past retention against the
          # same default the API and the purge resolve (GPS plan U11).
          GPS_POSITION_RETENTION_DAYS: !Ref GpsPositionRetentionDays

  # ---------------------------------------------------- Custom domain (gated)
  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasApiCert
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasApiCert
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomain
      Stage: $default

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasApiCert
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

Outputs:
  HttpApiUrl:
    Description: Default invoke URL for the HTTP API.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ApiCustomDomainUrl:
    Condition: HasApiCert
    Description: Custom-domain URL for the API.
    Value: !Sub "https://${ApiDomainName}"
  ApiFunctionName:
    Value: !Ref ApiFunction
  MigrateFunctionName:
    Value: !Ref MigrateFunction
  VerifyFunctionName:
    Value: !Ref VerifyFunction
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
